# CI: test backend với MySQL + Redis thật, build frontend, rồi thử build 2 Docker image.
# Giả định thư mục gốc của repo là thư mục chứa database/ và fitness/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # Giờ Việt Nam như máy chạy thật (gom doanh thu theo ngày, job 00:05...)
      TZ: Asia/Ho_Chi_Minh
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # Database rỗng; Flyway tạo bảng + nạp dữ liệu mẫu khi test khởi động
          MYSQL_DATABASE: fitness_db
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: fitness/back_end
        env:
          SPRING_DATASOURCE_PASSWORD: ci-root-password
        run: mvn -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: fitness/back_end/target/surefire-reports

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fitness/font_end/package-lock.json
      - name: Build
        working-directory: fitness/font_end
        run: |
          npm ci --no-audit --no-fund
          npm run build

  docker:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fitness-backend:ci fitness/back_end
      - name: Build frontend image
        run: docker build -t fitness-frontend:ci fitness/font_end
