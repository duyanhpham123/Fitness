spring.application.name=fitness
spring.config.import=optional:classpath:application-local.properties

# Local config (override in application-local.properties or env)
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fitness_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Mật khẩu đặt trong application-local.properties (máy dev) hoặc biến môi trường SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Load quan hệ lazy theo lô thay vì từng dòng (tránh N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# OTP
app.otp.expiration-seconds=300
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5
app.otp.max-sends-per-hour=5
# Only enable during development. MUST set false in production.
app.otp.expose-in-response=true

# Redis (docker compose up -d)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail: chưa cấu hình spring.mail.host thì OTP chỉ ghi log + trả devOtp
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@fitness.local}

# JWT
app.jwt.secret=${JWT_SECRET:doi-chuoi-nay-thanh-mot-chuoi-ngau-nhien-dai-it-nhat-32-ky-tu}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-expiration-remember-ms=2592000000

app.fe.base-url=${APP_FE_BASE_URL:http://127.0.0.1:5500}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== Swagger UI =====
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true

# ===== VNPay sandbox =====
# Đăng ký tài khoản test tại https://sandbox.vnpayment.vn/devreg/ để nhận TmnCode + HashSecret.
# Đặt 2 giá trị đó trong application-local.properties (đã gitignore) hoặc biến môi trường, KHÔNG ghi vào file này.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# VNPay chuyển trình duyệt về đây sau khi thanh toán; backend kiểm tra rồi chuyển tiếp sang trang kết quả của frontend
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/api/payments/vnpay/return}
app.vnpay.fe-result-url=${app.fe.base-url}/payment-result
app.vnpay.expire-minutes=15

# ===== Booking =====
app.booking.pt-slot-minutes=60
app.booking.cancel-before-hours=2

# ===== Đăng nhập =====
# Sai quá số lần này thì khóa đăng nhập theo email trong N phút
app.auth.max-login-attempts=5
app.auth.login-lock-minutes=15
