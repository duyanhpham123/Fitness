# =====================================================================
#  Cấu hình môi trường thật. Bật bằng: SPRING_PROFILES_ACTIVE=prod
#  Ghi đè application.properties; secret luôn lấy từ biến môi trường (deploy/.env).
# =====================================================================

# Không nạp tài khoản / dữ liệu mẫu (mật khẩu mẫu đang công khai trong repo)
spring.flyway.locations=classpath:db/migration
# DB thật luôn được tạo bởi Flyway từ đầu, không cần baseline
spring.flyway.baseline-on-migrate=false

# KHÔNG BAO GIỜ trả mã OTP trong response
app.otp.expose-in-response=false

# Không log câu SQL / tham số (lộ dữ liệu khách hàng trong log)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Tắt Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Chạy sau Caddy + nginx: lấy IP thật của khách và https từ header X-Forwarded-*
# (native = Tomcat RemoteIpValve, chỉ tin header từ IP mạng nội bộ của Docker -> khách không giả mạo được)
server.forward-headers-strategy=native

# Không trả stack trace / thông điệp lỗi nội bộ
server.error.include-stacktrace=never
server.error.include-message=never

# Refresh token chỉ nằm trong cookie httpOnly + Secure, không trả trong body JSON
app.auth.refresh-cookie-secure=true
app.auth.refresh-token-in-body=false
