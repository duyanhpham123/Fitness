# Phục vụ React (SPA) và chuyển tiếp /api sang backend, để trình duyệt chỉ thấy 1 origin (không cần CORS).

# Chạy sau Caddy (HTTPS) thì giữ nguyên giao thức gốc Caddy báo lên; chạy trực tiếp thì dùng giao thức của nginx
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # File build của Vite có hash trong tên -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # "app" là tên service backend trong compose.yaml
    location /api/ {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Mọi đường dẫn khác (/admin, /member/booking, /payment-result...) trả index.html cho React Router
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
